<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UIM Logbook — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700;700i&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="js/theme.css" />
<style>
  #page { padding: 1.25rem 1.1rem; }
  h1 { font-size: 1rem; font-weight: 500; margin-bottom: 0.9rem; }

  #new-project {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 1rem; display: flex; flex-direction: column; gap: 0.7rem; margin-bottom: 1.8rem;
  }
  #staff-checks { display: flex; flex-wrap: wrap; gap: 8px; }
  .staff-check {
    display: flex; align-items: center; gap: 6px; font-size: 0.82rem;
    border: 1px solid var(--border); border-radius: 20px; padding: 5px 10px 5px 8px; cursor: pointer;
  }
  .staff-check input { width: auto; }
  #form-note { font-size: 0.72rem; color: var(--accent); min-height: 1em; }

  .section-head { font-size: 0.92rem; font-weight: 500; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 0.8rem; }
  #empty-projects { font-size: 0.8rem; color: var(--muted); padding: 0.5rem 0; }

  .proj-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.9rem 1rem; margin-bottom: 10px; }
  .proj-client { font-family: var(--font-mono); font-size: 0.68rem; color: var(--muted); }
  .proj-brief { font-family: var(--font-disp); font-style: italic; font-size: 1.1rem; margin: 3px 0 8px; line-height: 1.3; }
  .proj-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .proj-entries { font-size: 0.78rem; color: var(--muted); }
  .proj-entries .who { color: var(--text); }

  #reset-row { margin-top: 2rem; text-align: right; }
  #reset-row button { font-family: var(--font-mono); font-size: 0.68rem; color: var(--muted); background: none; border: none; cursor: pointer; }
</style>
</head>
<body>

  <div id="topbar">
    <div id="brand">UIM Logbook</div>
    <nav><a href="staff.html">Staff view</a><a href="admin.html" class="current">Admin</a></nav>
  </div>

  <div id="page">
    <h1>Set up a project</h1>
    <div id="new-project">
      <div>
        <label>Client</label>
        <input id="f-client" list="client-list" placeholder="e.g. School X" />
        <datalist id="client-list"></datalist>
      </div>
      <div>
        <label>Brief</label>
        <input id="f-brief" placeholder="e.g. Manage the promotional videos and social posts this week" />
      </div>
      <div>
        <label>Assign staff</label>
        <div id="staff-checks"></div>
      </div>
      <div id="form-note"></div>
      <button class="btn btn-primary" id="btn-create" style="align-self:flex-start;">Create project</button>
    </div>

    <div class="section-head">Projects so far</div>
    <div id="projects"></div>
    <div id="empty-projects">Nothing created yet — set one up above.</div>

    <div id="reset-row"><button id="btn-reset">reset demo data</button></div>
  </div>

<script src="js/store.js"></script>
<script>
  const checksEl = document.getElementById('staff-checks');
  Store.STAFF.forEach(s => {
    const label = document.createElement('label');
    label.className = 'staff-check';
    label.innerHTML = `<input type="checkbox" value="${s.name}" /> ${s.name}`;
    checksEl.appendChild(label);
  });

  document.getElementById('btn-create').onclick = async () => {
    const client = document.getElementById('f-client').value.trim();
    const brief  = document.getElementById('f-brief').value.trim();
    const team   = [...checksEl.querySelectorAll('input:checked')].map(i => i.value);
    const note   = document.getElementById('form-note');

    if (!client || !brief) { note.textContent = 'Client and brief are both required.'; return; }
    if (!team.length)      { note.textContent = 'Assign at least one staff member.'; return; }

    await Store.addProject({ client, brief, team });
    document.getElementById('f-client').value = '';
    document.getElementById('f-brief').value = '';
    checksEl.querySelectorAll('input:checked').forEach(i => i.checked = false);
    note.textContent = '';
    render();
  };

  document.getElementById('btn-reset').onclick = async () => {
    if (!confirm('Clear all demo projects, entries and claims?')) return;
    await Store.resetAll();
    render();
  };

  async function render() {
    const projects = await Store.getAllProjects();

    const clientList = document.getElementById('client-list');
    clientList.innerHTML = '';
    [...new Set(projects.map(p => p.client))].forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      clientList.appendChild(opt);
    });

    const wrap = document.getElementById('projects');
    wrap.innerHTML = '';
    document.getElementById('empty-projects').style.display = projects.length ? 'none' : 'block';

    for (const p of projects) {
      const claims = await Store.getClaimsForProject(p.id);
      const entries = await Store.getEntries(p.id);

      const card = document.createElement('div');
      card.className = 'proj-card';

      const chips = p.team.map(name => {
        const done = !!claims[name];
        return `<span class="chip ${done ? 'done' : ''}">${name} — ${done ? 'done ✓' : 'in progress'}</span>`;
      }).join('');

      const entryLine = p.team.map(name => {
        const count = entries.filter(e => e.staff === name).length;
        return `<span class="who">${name}</span>: ${count} ${count === 1 ? 'entry' : 'entries'}`;
      }).join(' · ');

      card.innerHTML = `
        <div class="proj-client">${p.client.toUpperCase()}</div>
        <div class="proj-brief">"${p.brief}"</div>
        <div class="proj-chips">${chips}</div>
        <div class="proj-entries">${entryLine || 'No entries logged yet'}</div>
      `;
      wrap.appendChild(card);
    }
  }

  render();
  window.addEventListener('focus', render);
</script>

</body>
</html>
